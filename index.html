<!DOCTYPE html>
<html lang="en" data-ui-font="default" data-editor-font="sans" data-density="comfortable" data-content-width="comfortable" data-roundness="default" data-animations="full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Nodalis — your knowledge, connected</title>
<meta name="description" content="A local-first notes, canvas and knowledge-graph app. Your notes are plain markdown files on your own disk. Free forever, works offline, no account.">
<meta name="theme-color" content="#f6f2e9">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nodalis">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="preload" href="vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/space-grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body data-style="nodalis" data-mode="light">

<div id="app" class="app" data-sidebar="open" data-right="open" data-focus="off">

  <!-- ===================================================== top bar ===== -->
  <header class="topbar">
    <button id="btn-sidebar" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar" data-tip-kbd="Mod+B">
      <span data-icon="sidebar" data-icon-size="19"></span>
    </button>

    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 4l10.4 6v12L16 28 5.6 22V10z"/>
        <path d="M16 4v24M5.6 10l20.8 12M26.4 10L5.6 22" stroke-width="1.1" opacity="0.55"/>
        <circle cx="16" cy="16" r="3.1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="brand-name">Nodalis</span>
    </div>

    <button id="btn-search" class="topbar-search" title="Search or jump to anything" data-tip-kbd="Mod+K">
      <span data-icon="search" data-icon-size="16"></span>
      <span class="search-label">Search or jump to…</span>
      <kbd class="kbd" id="search-kbd">Ctrl K</kbd>
    </button>

    <div class="topbar-actions">
      <div class="btn-group only-desktop" id="view-tabs" role="tablist" aria-label="Views">
        <button data-view="editor" class="is-active" title="Notes" role="tab"><span data-icon="note" data-icon-size="16"></span></button>
        <button data-view="graph" title="Knowledge graph" role="tab" data-feature="graph"><span data-icon="graph" data-icon-size="16"></span></button>
        <button data-view="canvas" title="Canvas" role="tab" data-feature="canvas"><span data-icon="canvas" data-icon-size="16"></span></button>
        <button data-view="database" title="Database" role="tab" data-feature="database"><span data-icon="database" data-icon-size="16"></span></button>
        <button data-view="tasks" title="Tasks" role="tab" data-feature="tasks"><span data-icon="list-check" data-icon-size="16"></span></button>
      </div>

      <span class="topbar-divider only-desktop"></span>

      <button id="btn-capture" class="icon-btn mobile-hide" title="Quick capture" data-tip-kbd="Mod+Shift+C">
        <span data-icon="zap" data-icon-size="18"></span>
      </button>
      <button id="btn-theme" class="icon-btn" title="Switch light / dark" data-tip-kbd="Mod+Shift+L">
        <span data-icon="sun" data-icon-size="18"></span>
      </button>
      <button id="btn-install" class="icon-btn hidden" title="Install Nodalis as an app">
        <span data-icon="download" data-icon-size="18"></span>
      </button>
      <button id="btn-right-panel" class="icon-btn only-desktop" title="Toggle right panel">
        <span data-icon="sidebar-right" data-icon-size="18"></span>
      </button>
      <button id="btn-help" class="icon-btn mobile-hide" title="Help, shortcuts and tour" data-tip-kbd="F1">
        <span data-icon="help" data-icon-size="18"></span>
      </button>
      <button id="btn-settings" class="icon-btn mobile-hide" title="Settings" data-tip-kbd="Mod+,">
        <span data-icon="settings" data-icon-size="18"></span>
      </button>
      <button id="btn-more" class="icon-btn only-mobile" title="More">
        <span data-icon="more" data-icon-size="18"></span>
      </button>
    </div>
  </header>

  <div class="app-body">

    <!-- ==================================================== sidebar ===== -->
    <aside id="sidebar" class="sidebar" aria-label="Vault navigation">
      <div class="sidebar-head">
        <button id="btn-new-note" class="btn btn-primary btn-block" data-tip-kbd="Mod+N">
          <span data-icon="plus" data-icon-size="16"></span>
          <span>New note</span>
        </button>
        <div class="sidebar-actions">
          <button id="btn-new-folder" class="icon-btn" title="New folder"><span data-icon="folder-plus" data-icon-size="17"></span></button>
          <button id="btn-new-canvas" class="icon-btn" title="New canvas"><span data-icon="canvas" data-icon-size="17"></span></button>
          <button id="btn-daily" class="icon-btn" title="Today's daily note" data-tip-kbd="Mod+D"><span data-icon="calendar" data-icon-size="17"></span></button>
          <button id="btn-sort" class="icon-btn" title="Sort and filter"><span data-icon="sort" data-icon-size="17"></span></button>
        </div>
      </div>

      <div class="sidebar-tabs" role="tablist" aria-label="Sidebar sections">
        <button class="sidebar-tab is-active" data-tab="files" role="tab">Files</button>
        <button class="sidebar-tab" data-tab="tags" role="tab">Tags</button>
        <button class="sidebar-tab" data-tab="recent" role="tab">Recent</button>
        <button class="sidebar-tab" data-tab="canvases" role="tab">Boards</button>
      </div>

      <div class="sidebar-body">
        <div id="panel-files" class="sidebar-panel is-active" role="tabpanel"></div>
        <div id="panel-tags" class="sidebar-panel" role="tabpanel"></div>
        <div id="panel-recent" class="sidebar-panel" role="tabpanel"></div>
        <div id="panel-canvases" class="sidebar-panel" role="tabpanel"></div>
      </div>

      <div class="sidebar-foot">
        <button id="vault-status" class="vault-status" title="Where your notes are stored">
          <span class="vault-dot"></span>
          <span class="vault-status-main">
            <span class="vault-status-label">Starting…</span>
          </span>
          <span data-icon="chevron-right" data-icon-size="14"></span>
        </button>
      </div>
    </aside>

    <!-- ==================================================== main ======== -->
    <main id="main" class="main-view">

      <!-- ---------- editor ---------- -->
      <section id="view-editor" class="view is-active" data-view="editor">
        <div class="editor-head">
          <input id="note-title" class="note-title-input" placeholder="Untitled" aria-label="Note title" spellcheck="false" autocomplete="off">
          <div class="editor-actions">
            <button id="btn-pin" class="icon-btn" title="Pin note"><span data-icon="pin" data-icon-size="17"></span></button>
            <button id="btn-note-menu" class="icon-btn" title="Note actions"><span data-icon="more" data-icon-size="17"></span></button>
            <div class="segmented only-desktop" id="editor-mode" role="group" aria-label="Editor mode">
              <button data-mode="edit" title="Write only">Write</button>
              <button data-mode="split" class="is-active" title="Write and preview">Split</button>
              <button data-mode="preview" title="Read only">Read</button>
            </div>
            <button id="btn-editor-mode-mobile" class="icon-btn only-mobile" title="Toggle preview"><span data-icon="eye" data-icon-size="17"></span></button>
          </div>
        </div>

        <div id="editor-split" class="split editor-surface" data-mode="split">
          <div class="split-editor" id="split-editor">
            <textarea id="note-editor" class="note-editor" spellcheck="false" autocomplete="off" autocapitalize="sentences"
              placeholder="Start writing.  [[ links to another note.  / opens the block menu.  # adds a tag."></textarea>
          </div>
          <div class="split-preview" id="split-preview">
            <div id="note-preview" class="prose"></div>
          </div>
        </div>

        <div class="editor-foot">
          <span class="save-pip" id="save-pip"><span class="dot"></span><span id="save-label">Saved</span></span>
          <span id="word-count"></span>
          <span class="spacer"></span>
          <button id="btn-focus-mode" title="Focus mode">Focus</button>
        </div>

        <div id="editor-empty" class="empty-state hidden">
          <span data-icon="note" data-icon-size="46"></span>
          <div class="empty-state-title">No note open</div>
          <p class="empty-state-text">Pick something from the sidebar, or start a new note. Everything you write is saved automatically.</p>
          <div class="empty-state-actions">
            <button class="btn btn-primary" data-command="note.new">New note</button>
            <button class="btn" data-command="palette.open">Search notes</button>
          </div>
        </div>
      </section>

      <!-- ---------- graph ---------- -->
      <section id="view-graph" class="view" data-view="graph">
        <div class="view-header">
          <h2 class="view-title">Knowledge graph</h2>
          <div class="view-header-actions">
            <div class="segmented" id="graph-scope">
              <button data-scope="global" class="is-active">All notes</button>
              <button data-scope="local">Around this note</button>
            </div>
            <label class="row small muted" style="gap:6px">
              <input type="checkbox" id="graph-show-tags"> tags
            </label>
            <label class="row small muted" style="gap:6px">
              <input type="checkbox" id="graph-show-orphans" checked> orphans
            </label>
            <button class="btn btn-sm" id="graph-reset">Reset view</button>
          </div>
        </div>
        <div class="graph-wrap" id="graph-wrap">
          <canvas id="graph-canvas" class="graph-canvas"></canvas>
          <div class="graph-overlay">
            <div class="graph-legend" id="graph-legend"></div>
          </div>
          <div class="graph-controls">
            <button class="icon-btn" id="graph-zoom-in" title="Zoom in"><span data-icon="plus" data-icon-size="17"></span></button>
            <button class="icon-btn" id="graph-zoom-out" title="Zoom out"><span data-icon="minus" data-icon-size="17"></span></button>
            <button class="icon-btn" id="graph-fit" title="Fit to view"><span data-icon="maximize" data-icon-size="17"></span></button>
          </div>
        </div>
      </section>

      <!-- ---------- canvas ---------- -->
      <section id="view-canvas" class="view" data-view="canvas">
        <div class="view-header">
          <select id="canvas-picker" class="field" style="width:auto;min-width:170px" aria-label="Choose canvas"></select>
          <div class="view-header-actions">
            <button class="btn btn-sm" id="canvas-new"><span data-icon="plus" data-icon-size="15"></span> Canvas</button>
            <button class="btn btn-sm" id="canvas-rename">Rename</button>
            <button class="btn btn-sm btn-danger" id="canvas-delete">Delete</button>
          </div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas class="canvas-grid" id="canvas-grid"></canvas>
          <div class="canvas-layer" id="canvas-layer">
            <svg class="canvas-svg" id="canvas-svg"></svg>
          </div>
          <div class="canvas-toolbar" id="canvas-toolbar">
            <button class="icon-btn is-active" data-tool="select" title="Select (V)"><span data-icon="drag" data-icon-size="18"></span></button>
            <button class="icon-btn" data-tool="pan" title="Pan (H)"><span data-icon="move" data-icon-size="18"></span></button>
            <button class="icon-btn" data-tool="pen" title="Draw (P)"><span data-icon="pen" data-icon-size="18"></span></button>
            <button class="icon-btn" data-tool="eraser" title="Erase (E)"><span data-icon="eraser" data-icon-size="18"></span></button>
            <span class="topbar-divider"></span>
            <button class="icon-btn" data-add="card" title="Add card (C)"><span data-icon="note" data-icon-size="18"></span></button>
            <button class="icon-btn" data-add="sticky" title="Add sticky (S)"><span data-icon="sticky" data-icon-size="18"></span></button>
            <button class="icon-btn" data-add="shape" title="Add shape (R)"><span data-icon="shapes" data-icon-size="18"></span></button>
            <button class="icon-btn" data-add="frame" title="Add frame (F)"><span data-icon="layout" data-icon-size="18"></span></button>
            <button class="icon-btn" data-add="noteref" title="Embed a note (N)"><span data-icon="link" data-icon-size="18"></span></button>
            <button class="icon-btn" data-add="image" title="Add image (I)"><span data-icon="image" data-icon-size="18"></span></button>
          </div>
          <div class="canvas-zoom">
            <button class="icon-btn" id="canvas-zoom-in" title="Zoom in"><span data-icon="plus" data-icon-size="16"></span></button>
            <div class="canvas-zoom-level" id="canvas-zoom-level">100%</div>
            <button class="icon-btn" id="canvas-zoom-out" title="Zoom out"><span data-icon="minus" data-icon-size="16"></span></button>
            <button class="icon-btn" id="canvas-zoom-fit" title="Fit"><span data-icon="maximize" data-icon-size="16"></span></button>
          </div>
        </div>
      </section>

      <!-- ---------- database ---------- -->
      <section id="view-database" class="view" data-view="database">
        <div class="view-header">
          <div class="db-toolbar">
            <select id="db-source" class="field" style="width:auto;min-width:150px" aria-label="Data source"></select>
            <div class="segmented" id="db-layout">
              <button data-layout="table" class="is-active"><span data-icon="table" data-icon-size="15"></span> Table</button>
              <button data-layout="board"><span data-icon="kanban" data-icon-size="15"></span> Board</button>
              <button data-layout="gallery"><span data-icon="gallery" data-icon-size="15"></span> Gallery</button>
              <button data-layout="calendar"><span data-icon="calendar" data-icon-size="15"></span> Calendar</button>
            </div>
          </div>
          <div class="view-header-actions">
            <button class="btn btn-sm" id="db-filter"><span data-icon="filter" data-icon-size="15"></span> Filter</button>
            <select id="db-group" class="field" style="width:auto;min-width:130px" aria-label="Group by"></select>
            <button class="btn btn-sm" id="db-new-view" title="Save this view">Save view</button>
          </div>
        </div>
        <div class="view-body no-scroll" id="db-body"></div>
      </section>

      <!-- ---------- tasks ---------- -->
      <section id="view-tasks" class="view" data-view="tasks">
        <div class="view-header">
          <h2 class="view-title">Tasks</h2>
          <div class="view-header-actions">
            <div class="segmented" id="task-filter">
              <button data-filter="open" class="is-active">Open</button>
              <button data-filter="today">Today</button>
              <button data-filter="upcoming">Upcoming</button>
              <button data-filter="done">Done</button>
              <button data-filter="all">All</button>
            </div>
            <select id="task-scope" class="field" style="width:auto;min-width:160px" aria-label="Scope"></select>
            <button class="btn btn-sm btn-primary" id="task-new"><span data-icon="plus" data-icon-size="15"></span> Task</button>
          </div>
        </div>
        <div class="view-body" id="tasks-body"></div>
      </section>

      <!-- ---------- eisenhower matrix ---------- -->
      <section id="view-matrix" class="view" data-view="matrix">
        <div class="view-header">
          <h2 class="view-title">Priority matrix</h2>
          <div class="view-header-actions">
            <select id="matrix-scope" class="field" style="width:auto;min-width:180px" aria-label="Scope"></select>
            <button class="btn btn-sm" id="matrix-help"><span data-icon="help" data-icon-size="15"></span> How this works</button>
          </div>
        </div>
        <div class="view-body no-scroll" id="matrix-body"></div>
      </section>

      <!-- ---------- sticky wall ---------- -->
      <section id="view-sticky" class="view" data-view="sticky">
        <div class="view-header">
          <h2 class="view-title">Sticky wall</h2>
          <div class="view-header-actions">
            <button class="btn btn-sm btn-primary" id="sticky-new"><span data-icon="plus" data-icon-size="15"></span> Sticky</button>
            <button class="btn btn-sm" id="sticky-arrange" title="Tidy the wall">Tidy up</button>
            <div class="segmented" id="sticky-filter">
              <button data-filter="all" class="is-active">All</button>
              <button data-filter="text">Notes</button>
              <button data-filter="todo">Lists</button>
              <button data-filter="draw">Sketches</button>
            </div>
          </div>
        </div>
        <div class="view-body" id="sticky-body"></div>
      </section>

      <!-- ---------- scratchpad ---------- -->
      <section id="view-scratch" class="view" data-view="scratch">
        <div class="view-header">
          <h2 class="view-title">Scratchpad</h2>
          <div class="view-header-actions">
            <div class="segmented" id="scratch-filter">
              <button data-filter="inbox" class="is-active">Inbox</button>
              <button data-filter="archived">Archived</button>
              <button data-filter="all">All</button>
            </div>
          </div>
        </div>
        <div class="view-body view-pad" id="scratch-body"></div>
      </section>

      <!-- ---------- daily review ---------- -->
      <section id="view-review" class="view" data-view="review">
        <div class="view-header">
          <h2 class="view-title">Daily review</h2>
          <div class="view-header-actions">
            <button class="btn btn-sm" id="review-open-daily">Open today's note</button>
          </div>
        </div>
        <div class="view-body view-pad" id="review-body"></div>
      </section>

      <!-- ---------- search ---------- -->
      <section id="view-search" class="view" data-view="search">
        <div class="view-header">
          <input id="search-input" class="field" placeholder="Search everything — try tag:idea, path:Projects, &quot;exact phrase&quot;" aria-label="Search">
          <div class="view-header-actions">
            <span class="small muted" id="search-count"></span>
            <button class="btn btn-sm" id="search-save">Save search</button>
          </div>
        </div>
        <div class="view-body view-pad" id="search-body"></div>
      </section>

      <!-- ---------- settings ---------- -->
      <section id="view-settings" class="view" data-view="settings">
        <div class="view-header">
          <h2 class="view-title">Settings</h2>
          <div class="view-header-actions">
            <button class="btn btn-sm" id="settings-export-config">Export settings</button>
          </div>
        </div>
        <div class="view-body view-pad" id="settings-body"></div>
      </section>

    </main>

    <!-- ================================================ right panel ===== -->
    <aside id="right-panel" class="right-panel" aria-label="Note context">
      <div class="right-tabs" role="tablist">
        <button class="right-tab is-active" data-rtab="backlinks" role="tab">Links</button>
        <button class="right-tab" data-rtab="outline" role="tab">Outline</button>
        <button class="right-tab" data-rtab="props" role="tab">Info</button>
      </div>
      <div class="right-body">
        <div id="rpane-backlinks" class="right-pane is-active" role="tabpanel"></div>
        <div id="rpane-outline" class="right-pane" role="tabpanel"></div>
        <div id="rpane-props" class="right-pane" role="tabpanel"></div>
      </div>
    </aside>

  </div>

  <!-- ================================================== mobile nav ===== -->
  <nav class="mobile-nav" id="mobile-nav" aria-label="Main">
    <button class="mobile-nav-btn is-active" data-view="editor">
      <span data-icon="note" data-icon-size="21"></span><span>Notes</span>
    </button>
    <button class="mobile-nav-btn" data-action="search">
      <span data-icon="search" data-icon-size="21"></span><span>Search</span>
    </button>
    <button class="mobile-nav-btn" data-action="capture">
      <span data-icon="zap" data-icon-size="21"></span><span>Capture</span>
    </button>
    <button class="mobile-nav-btn" data-view="tasks">
      <span data-icon="list-check" data-icon-size="21"></span><span>Tasks</span>
    </button>
    <button class="mobile-nav-btn" data-action="more">
      <span data-icon="more" data-icon-size="21"></span><span>More</span>
    </button>
  </nav>

</div>

<div id="scrim" class="scrim"></div>
<div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:40px;font-family:system-ui;max-width:520px;margin:0 auto;text-align:center">
    <h1>Nodalis needs JavaScript</h1>
    <p>This is an offline-first app that runs entirely in your browser — there is no server to render pages for you. Enable JavaScript to continue.</p>
  </div>
</noscript>

<!-- core -->
<script src="js/core/util.js"></script>
<script src="js/core/bus.js"></script>
<script src="js/core/db.js"></script>
<script src="js/core/serialize.js"></script>
<script src="js/core/vault.js"></script>
<script src="js/core/store.js"></script>
<!-- ui -->
<script src="js/ui/icons.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/ui/loader.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/commands.js"></script>
<script src="js/ui/shortcuts.js"></script>
<script src="js/ui/palette.js"></script>
<!-- features -->
<script src="js/features/markdown.js"></script>
<script src="js/features/search.js"></script>
<script src="js/features/sidebar.js"></script>
<script src="js/features/editor.js"></script>
<script src="js/features/panels.js"></script>
<script src="js/features/graph.js"></script>
<script src="js/features/canvas.js"></script>
<script src="js/features/database.js"></script>
<script src="js/features/tasks.js"></script>
<script src="js/features/matrix.js"></script>
<script src="js/features/sticky.js"></script>
<script src="js/features/scratch.js"></script>
<script src="js/features/daily.js"></script>
<script src="js/features/ocr.js"></script>
<script src="js/features/exporter.js"></script>
<script src="js/features/settings.js"></script>
<script src="js/features/onboarding.js"></script>
<script src="js/features/help.js"></script>
<!-- boot -->
<script src="js/app.js"></script>
</body>
</html>
